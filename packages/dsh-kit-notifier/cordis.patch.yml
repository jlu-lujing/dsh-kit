# dsh-kit-notifier feature patch layer.
#
# This row's `disabled` is a dynamic expression that reads the dsh-kit state
# file, so `dsh-kit disable dsh-kit-notifier` (or the store panel) takes
# effect on the next load without editing any patch file. The expression is
# self-contained (Node builtin `fs` via `process.getBuiltinModule`, path via
# `dshHomePath`) so it is correct from the first loader pass, before the
# dsh-kit host plugin applies.

- insert:
    - id: dsh-kit-notifier
      name: dsh-kit-notifier
      disabled: !!js "( (function () { try { var fs = process.getBuiltinModule('fs'); var s = JSON.parse(fs.readFileSync(dshHomePath('dsh-kit/state.json'), 'utf8')); return s.features['dsh-kit-notifier'] === false; } catch (e) { return false; } })() )"
