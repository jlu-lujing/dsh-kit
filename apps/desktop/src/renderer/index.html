<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dsh-kit Desktop</title>
    <style>
      :root {
        --bg: #0f1420;
        --fg: #e8ecf4;
        --muted: #8b94a7;
        --accent: #4f8cff;
        --err: #ff6b6b;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, #1a2236 0%, var(--bg) 60%);
        color: var(--fg);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        -webkit-user-select: none;
        user-select: none;
      }
      .logo {
        width: 88px;
        height: 88px;
        margin: 0 auto 24px;
        display: block;
        /*
          SVG 由 main 在启动前以 data-uri 注入（避免打包路径问题）；
          默认隐藏，注入后显示。
        */
        opacity: 0;
        transition: opacity .3s ease;
      }
      .logo.show { opacity: 1; }
      h1 {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: .5px;
      }
      .sub {
        color: var(--muted);
        margin-top: 6px;
        font-size: 13px;
      }
      .status {
        margin-top: 28px;
        color: var(--accent);
        font-size: 15px;
        min-height: 22px;
      }
      .detail {
        margin-top: 12px;
        color: var(--muted);
        font-size: 13px;
        max-width: 560px;
        line-height: 1.7;
        word-break: break-all;
      }
      .detail.error {
        color: var(--err);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        background: rgba(255, 107, 107, .08);
        border: 1px solid rgba(255, 107, 107, .25);
        border-radius: 8px;
        padding: 12px 16px;
        margin-top: 16px;
        text-align: left;
      }
      .spinner {
        width: 22px;
        height: 22px;
        margin: 0 auto;
        border: 2px solid rgba(79, 140, 255, .25);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin .9s linear infinite;
        margin-top: 16px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .hidden { display: none; }
      button {
        margin-top: 20px;
        padding: 8px 22px;
        border-radius: 999px;
        border: 1px solid rgba(79, 140, 255, .5);
        background: rgba(79, 140, 255, .12);
        color: var(--accent);
        font-size: 14px;
        cursor: pointer;
        transition: background .2s;
      }
      button:hover { background: rgba(79, 140, 255, .22); }
    </style>
  </head>
  <body>
    <div id="app">
      <img id="logo" class="logo" alt="dsh-kit" />
      <h1>dsh-kit</h1>
      <p class="sub" id="subtitle">DeepSeek Harness 桌面客户端</p>
      <div id="spinner" class="spinner"></div>
      <p class="status" id="status">正在启动 dsh…</p>
      <p class="detail" id="detail"></p>
      <button id="retry" class="hidden" type="button">重新加载</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
